name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  MAVEN_ARGS: -B -ntp

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Full build, including the integration tests and static analysis
        run: mvn $MAVEN_ARGS verify -Prun-its,quality
      - name: The tag and the project version must agree
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(mvn $MAVEN_ARGS -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Tag $tag, project version $version"
          if [[ "$tag" != "v$version" ]]; then
            echo "The tag $tag does not match the project version $version" >&2
            exit 1
          fi

  publish:
    name: Publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    # Approve the deployment in the repository's environment settings before it runs.
    environment: maven-central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Sign and deploy
        run: mvn $MAVEN_ARGS deploy -Prelease -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Attach a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            target/*.jar
            target/*.jar.asc
