version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
      test-libraries:
        patterns:
          - "org.junit*:*"
          - "org.assertj:*"
          - "org.mockito:*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
